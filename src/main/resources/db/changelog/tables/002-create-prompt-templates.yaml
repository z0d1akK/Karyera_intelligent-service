databaseChangeLog:

  - changeSet:
      id: 002-create-prompt-templates
      author: zodiakk

      changes:
        - createTable:
            tableName: prompt_templates
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: task_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: system_prompt
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: user_prompt_template
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: output_schema_version
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: prompt_templates
            columnNames: code, version
            constraintName: uq_prompt_template_version

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE prompt_templates ADD CONSTRAINT chk_prompt_template_version CHECK (version > 0);
